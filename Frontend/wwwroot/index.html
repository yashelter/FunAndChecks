<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunAndChecks</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png?v=2" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <script>
        const preference = (() => { try { return localStorage.getItem('fc-theme'); } catch { return null; } })();
        const isLightTheme = preference === 'light';
        document.documentElement.dataset.theme = isLightTheme ? 'light' : 'dark';
        // Акцент на экране загрузки — из той же cookie, что и в приложении (DashboardAppearanceService);
        // у готовых акцентов в светлой теме свой, более тёмный оттенок. После старта Blazor сам выставит точный цвет.
        (() => {
            const lightShades = { '#66e4c1': '#13896e', '#b5a0ff': '#7350cc', '#86b5ff': '#366ba9', '#70d8e8': '#087b91', '#efb07b': '#a25b12', '#ec9cc2': '#b7437d' };
            let accent = null;
            try {
                const cookie = document.cookie.split(';').map(s => s.trim()).find(s => s.startsWith('fc-accent='));
                const candidate = decodeURIComponent(cookie?.slice('fc-accent='.length) || '').toLowerCase();
                if (/^#[0-9a-f]{6}$/.test(candidate)) accent = candidate;
            } catch { }
            accent ??= '#66e4c1';
            if (isLightTheme && lightShades[accent]) accent = lightShades[accent];
            document.documentElement.style.setProperty('--fc-accent', accent);
        })();
        const uiStyles = [
            'css/app.css', 'css/dashboard.css?v=nav-1', 'Frontend.styles.css?v=color-wheel-1', '_content/Frontend.Shared/dashboard-content.css?v=20',
            '_content/Frontend.Shared/profiles.css?v=effects-1', '_content/Frontend.Shared/profile-navigation.css?v=2', '_content/Frontend.Shared/community.css?v=12',
            '_content/Frontend.Admin/admin-dashboard.css?v=ux-12', '_content/Frontend.Admin/management-dashboard.css?v=ux-9'
        ];
        for (const href of uiStyles) {
            const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '/' + href;
            document.head.appendChild(link);
        }
        // Оформление активных достижений: правила привязаны к [data-fx="id достижения"]; идёт после стилей интерфейса.
        {
            const effects = document.createElement('link'); effects.id = 'fc-fx'; effects.rel = 'stylesheet'; effects.href = '/api/achievements/effects.css';
            try { effects.disabled = localStorage.getItem('fc-fx') === 'off'; } catch { }
            document.head.appendChild(effects);
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet" />
    <style>
        /* Экран загрузки в цветах темы: стили здесь, а не в dashboard.css — таблицы стилей подключаются скриптом
           и могут прийти позже, чем экран покажется. Цвета совпадают с токенами --fc-* в dashboard.css. */
        #app-loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 24px;
            background: #0b1220; color: #91a1b6; font-family: Inter, 'Segoe UI', Arial, sans-serif;
            --loading-line: #263449; --loading-track: #1d2b3e;
        }
        :root[data-theme=light] #app-loading { background: #f4f7fb; color: #607187; --loading-line: #dce4ed; --loading-track: #e9eef4; }
        :root[data-theme=light] body { background: #f4f7fb; }
        body { background: #0b1220; }
        #app-loading video, #app-loading img { width: 180px; height: 180px; object-fit: contain; border: 1px solid var(--loading-line); border-radius: 12px; }
        #app-loading .loading-text { font-size: 13px; letter-spacing: .4px; }
        #app-loading .loading-text .dots span {
            animation: app-blink 1.4s infinite both;
        }
        #app-loading .loading-text .dots span:nth-child(2) { animation-delay: .2s; }
        #app-loading .loading-text .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes app-blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        #app-loading .loading-bar {
            width: 248px; height: 5px; border-radius: 8px; overflow: hidden;
            background: var(--loading-track); border: 1px solid var(--loading-line); position: relative;
        }
        #app-loading .loading-bar::before {
            content: ""; position: absolute; left: -45%; top: 0; height: 100%; width: 45%;
            background: linear-gradient(90deg, transparent, var(--fc-accent, #66e4c1), transparent);
            animation: app-slide 1.8s infinite ease-in-out;
        }
        @keyframes app-slide { 0% { left: -45%; } 100% { left: 100%; } }
        @media (prefers-reduced-motion: reduce) {
            #app-loading .loading-bar::before, #app-loading .loading-text .dots span { animation: none; }
            #app-loading .loading-bar::before { left: 0; width: 100%; }
        }
    </style>
    <script src="js/dashboard-bootstrap.js"></script>
    <link id="fc-fx" rel="stylesheet" href="api/achievements/effects.css" />
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div id="app-loading-media"></div>
            <div class="loading-text"><span id="loading-label">Loading</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
            <div class="loading-bar"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span id="fatal-label">An unexpected error occurred.</span>
        <a href="." class="reload" id="reload-label">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        const startupCulture = window.culturePreference.get();
        document.documentElement.lang = startupCulture;
        if (startupCulture === 'ru-RU') {
            document.getElementById('loading-label').textContent = 'Загрузка';
            document.getElementById('fatal-label').textContent = 'Произошла непредвиденная ошибка.';
            document.getElementById('reload-label').textContent = 'Перезагрузить';
        }

        // Случайный ассет экрана загрузки из папки wwwroot/loading (gif/mp4/webm/png/...).
        (function () {
            const fallback = 'loading/loading.mp4';
            const mount = document.getElementById('app-loading-media');
            if (!mount) return;

            const render = (src) => {
                const lower = src.toLowerCase();
                const isVideo = lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.ogg');
                if (isVideo) {
                    const v = document.createElement('video');
                    v.src = src; v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
                    mount.appendChild(v);
                } else {
                    const img = document.createElement('img');
                    img.src = src; img.alt = 'loading';
                    mount.appendChild(img);
                }
            };

            fetch('/api/loading-assets')
                .then(r => r.ok ? r.json() : [])
                .then(list => {
                    const media = Array.isArray(list) ? list.filter(src => typeof src === 'string' && /\.(gif|mp4|webm|ogg|png|jpe?g|webp|svg|avif)$/i.test(src)) : [];
                    const pick = media.length
                        ? media[Math.floor(Math.random() * media.length)]
                        : fallback;
                    render(pick);
                })
                .catch(() => render(fallback));
        })();
    </script>

    <script src="js/dashboard-appearance.js"></script>
    <script src="js/snackbar-swipe.js"></script>
    <script src="_content/Frontend.Shared/profile-navigation.js"></script>
    <script src="_content/Frontend.Shared/results-scroll.js?v=3"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>Blazor.start({ applicationCulture: window.culturePreference.get() });</script>
    <script>
        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName ?? '';
            anchor.click();
            anchor.remove();
            // Некоторые браузеры начинают читать blob уже после click(): отзываем адрес не сразу.
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        };
        // Большие файлы (бэкапы) браузер качает сам по подписанной ссылке — потоком на диск.
        window.downloadFileFromUrl = (fileName, url) => {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName ?? '';
            anchor.rel = 'noopener';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        };
    </script>
</body>

</html>

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 4
  delete_request_store: filesystem

limits_config:
  retention_period: ${TECHNICAL_LOG_RETENTION:-336h}
  retention_stream:
    - selector: '{log_kind="admin_audit"}'
      priority: 10
      period: ${ADMIN_AUDIT_RETENTION:-8760h}
  reject_old_samples: true
  reject_old_samples_max_age: ${TECHNICAL_LOG_RETENTION:-336h}
  unordered_writes: true
  allow_structured_metadata: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB
  max_line_size: 256KB
  max_query_parallelism: 4
  max_query_series: 500

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 128MB

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

analytics:
  reporting_enabled: false

